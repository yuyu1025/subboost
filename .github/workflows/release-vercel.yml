name: Release Vercel Deploy & Promote

on:
  push:
    branches:
      - "release/*"

permissions:
  contents: write

concurrency:
  group: release-vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  OBSERVATION_MINUTES: 15
  POLL_INTERVAL_SECONDS: 30

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      release_branch: ${{ steps.meta.outputs.release_branch }}
      release_version: ${{ steps.meta.outputs.release_version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"

      - name: Validate release branch and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != release/* ]]; then
            echo "This workflow must run on a release/* branch, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          release_version="$(node -p "require('./package.json').version")"
          if [ -z "${release_version}" ]; then
            echo "Failed to read version from package.json." >&2
            exit 1
          fi

          tag_name="v${release_version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag_name}" >/dev/null 2>&1; then
            echo "Tag ${tag_name} already exists on origin. Bump package.json version before releasing." >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA::12}"
          echo "release_branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run check:local-app

  deploy-vercel:
    runs-on: ubuntu-latest
    needs:
      - meta
      - checks
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
      vercel_org_id: ${{ steps.resolve_vercel.outputs.vercel_org_id }}
      vercel_project_id: ${{ steps.resolve_vercel.outputs.vercel_project_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"

      - name: Resolve Vercel org and project IDs
        id: resolve_vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "Missing required GitHub Secret: VERCEL_TOKEN" >&2
            exit 1
          fi

          if [ -n "${VERCEL_ORG_ID}" ] && [ -n "${VERCEL_PROJECT_ID}" ]; then
            echo "vercel_org_id=${VERCEL_ORG_ID}" >> "$GITHUB_OUTPUT"
            echo "vercel_project_id=${VERCEL_PROJECT_ID}" >> "$GITHUB_OUTPUT"
            echo "Using VERCEL_ORG_ID and VERCEL_PROJECT_ID from GitHub Secrets."
            exit 0
          fi

          resolved="$(node -e '
            const token = process.env.VERCEL_TOKEN;
            const repoFull = (process.env.GITHUB_REPOSITORY || "").toLowerCase();
            const repoName = (repoFull.split("/")[1] || "").toLowerCase();
            const headers = { Authorization: `Bearer ${token}` };

            async function apiGet(path) {
              const res = await fetch(`https://api.vercel.com${path}`, { headers });
              if (!res.ok) {
                throw new Error(`GET ${path} failed (${res.status}): ${await res.text()}`);
              }
              return res.json();
            }

            (async () => {
              const userRes = await apiGet("/v2/user");
              const userId = userRes?.user?.id || "";

              let teamIds = [];
              try {
                const teamsRes = await apiGet("/v2/teams?limit=100");
                teamIds = (teamsRes?.teams || []).map((t) => t.id).filter(Boolean);
              } catch (err) {
                console.error(`Warning: failed to list Vercel teams: ${err.message}`);
              }

              const scopes = [null, ...teamIds];
              const seen = new Set();
              const allProjects = [];

              for (const teamId of scopes) {
                const query = teamId ? `?limit=100&teamId=${encodeURIComponent(teamId)}` : "?limit=100";
                try {
                  const data = await apiGet(`/v9/projects${query}`);
                  for (const p of data?.projects || []) {
                    if (!p?.id || seen.has(p.id)) continue;
                    seen.add(p.id);
                    allProjects.push({
                      id: p.id,
                      name: p.name || "",
                      orgId: teamId || p.accountId || userId,
                      link: p.link || null,
                    });
                  }
                } catch (err) {
                  console.error(`Warning: failed to list projects for scope ${teamId || "personal"}: ${err.message}`);
                }
              }

              let matched = allProjects.find((p) => {
                if (p.link?.type !== "github") return false;
                const linkedRepo = `${p.link.org || ""}/${p.link.repo || ""}`.toLowerCase();
                return linkedRepo === repoFull;
              });

              if (!matched && repoName) {
                matched = allProjects.find((p) => p.name.toLowerCase() === repoName);
              }

              if (!matched) {
                const names = allProjects.map((p) => `${p.name} (${p.id})`).join(", ") || "(none)";
                throw new Error(
                  `Could not auto-detect Vercel project for ${process.env.GITHUB_REPOSITORY}. Found projects: ${names}. Set VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets manually.`
                );
              }

              const orgId = process.env.VERCEL_ORG_ID || matched.orgId;
              const projectId = process.env.VERCEL_PROJECT_ID || matched.id;
              if (!orgId || !projectId) {
                throw new Error("Resolved Vercel orgId or projectId is empty.");
              }
              process.stdout.write(JSON.stringify({ orgId, projectId, name: matched.name }));
            })().catch((err) => {
              console.error(err);
              process.exit(1);
            });
          ')"

          org_id="$(RESOLVED="${resolved}" node -e 'process.stdout.write(JSON.parse(process.env.RESOLVED).orgId)')"
          project_id="$(RESOLVED="${resolved}" node -e 'process.stdout.write(JSON.parse(process.env.RESOLVED).projectId)')"
          project_name="$(RESOLVED="${resolved}" node -e 'process.stdout.write(JSON.parse(process.env.RESOLVED).name)')"

          echo "Auto-discovered Vercel project: ${project_name} (${project_id}) under org ${org_id}"
          echo "vercel_org_id=${org_id}" >> "$GITHUB_OUTPUT"
          echo "vercel_project_id=${project_id}" >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel production
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.resolve_vercel.outputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ steps.resolve_vercel.outputs.vercel_project_id }}
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" | tail -n 1 | tr -d '[:space:]')"
          if [[ "${deployment_url}" != https://* ]]; then
            echo "Unexpected Vercel deployment URL: ${deployment_url}" >&2
            exit 1
          fi

          deployment_id="$(DEPLOYMENT_URL="${deployment_url}" node -e '
            (async () => {
              const host = new URL(process.env.DEPLOYMENT_URL).host;
              const orgId = process.env.VERCEL_ORG_ID || "";
              const teamQuery = orgId.startsWith("team_") ? `?teamId=${encodeURIComponent(orgId)}` : "";
              const res = await fetch(`https://api.vercel.com/v13/deployments/${encodeURIComponent(host)}${teamQuery}`, {
                headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
              });
              if (!res.ok) {
                throw new Error(`Failed to fetch deployment info (${res.status}): ${await res.text()}`);
              }
              const data = await res.json();
              if (!data.id) {
                throw new Error("Vercel deployment ID was not returned.");
              }
              process.stdout.write(data.id);
            })().catch((err) => {
              console.error(err);
              process.exit(1);
            });
          ')"

          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"

          {
            echo "### Vercel Production Deployment Ready"
            echo ""
            echo "- **Branch**: \`${{ needs.meta.outputs.release_branch }}\`"
            echo "- **Commit**: \`${GITHUB_SHA}\`"
            echo "- **Target Tag**: \`${{ needs.meta.outputs.tag_name }}\`"
            echo "- **Deployment URL**: ${deployment_url}"
            echo "- **Deployment ID**: \`${deployment_id}\`"
            echo ""
            echo "Entering **${OBSERVATION_MINUTES}-minute** rollback observation window. To abort merging to \`main\` and tagging:"
            echo "1. Roll back to a previous deployment in the Vercel Dashboard (or run \`vercel rollback\`), **or**"
            echo "2. Cancel this GitHub Actions workflow run, **or**"
            echo "3. Push a new commit to \`${{ needs.meta.outputs.release_branch }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  wait-and-promote:
    runs-on: ubuntu-latest
    needs:
      - meta
      - deploy-vercel
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"

      - name: Wait for rollback observation window
        id: observe
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ needs.deploy-vercel.outputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ needs.deploy-vercel.outputs.vercel_project_id }}
          EXPECTED_DEPLOYMENT_ID: ${{ needs.deploy-vercel.outputs.deployment_id }}
        run: |
          set -euo pipefail
          node -e '
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function getActiveProductionId() {
              const projectId = process.env.VERCEL_PROJECT_ID;
              const orgId = process.env.VERCEL_ORG_ID || "";
              const teamQuery = orgId.startsWith("team_") ? `?teamId=${encodeURIComponent(orgId)}` : "";
              const res = await fetch(`https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}${teamQuery}`, {
                headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
              });
              if (!res.ok) {
                throw new Error(`Vercel API returned ${res.status}: ${await res.text()}`);
              }
              const data = await res.json();
              return data?.targets?.production?.id || "";
            }

            (async () => {
              const totalMs = Number(process.env.OBSERVATION_MINUTES || 15) * 60 * 1000;
              const pollMs = Number(process.env.POLL_INTERVAL_SECONDS || 30) * 1000;
              const expectedId = process.env.EXPECTED_DEPLOYMENT_ID;
              const deadline = Date.now() + totalMs;

              console.log(`Observing Vercel production deployment ${expectedId} for ${totalMs / 60000} minutes...`);

              while (Date.now() < deadline) {
                const remainingMs = deadline - Date.now();
                await sleep(Math.min(pollMs, remainingMs));

                try {
                  const activeId = await getActiveProductionId();
                  if (activeId && activeId !== expectedId) {
                    console.log(`::warning::Manual rollback or newer deployment detected on Vercel (expected ${expectedId}, active ${activeId}). Skipping merge to main and tagging.`);
                    process.exit(42);
                  }
                  const minsLeft = Math.max(0, Math.ceil((deadline - Date.now()) / 60000));
                  console.log(`Active production deployment still matches ${expectedId}. ~${minsLeft} min remaining.`);
                } catch (err) {
                  console.log(`::warning::Transient error checking Vercel status: ${err.message}`);
                }
              }

              // Final fail-closed verification before promoting to main
              const finalActiveId = await getActiveProductionId();
              if (!finalActiveId) {
                throw new Error("Could not determine active Vercel production deployment at final verification.");
              }
              if (finalActiveId !== expectedId) {
                console.log(`::warning::Manual rollback or newer deployment detected on Vercel at final check (expected ${expectedId}, active ${finalActiveId}). Skipping merge to main and tagging.`);
                process.exit(42);
              }
              console.log(`Observation window completed cleanly. Active production deployment is still ${expectedId}.`);
            })().catch((err) => {
              console.error(err);
              process.exit(1);
            });
          ' && status=0 || status=$?

          if [ "${status}" -eq 42 ]; then
            echo "rolled_back=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Rollback Detected — Promotion Skipped"
              echo ""
              echo "Vercel production deployment is no longer \`${EXPECTED_DEPLOYMENT_ID}\`."
              echo "Skipped merging \`${{ needs.meta.outputs.release_branch }}\` into \`main\` and creating tag \`${{ needs.meta.outputs.tag_name }}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi

          echo "rolled_back=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository for promotion
        if: steps.observe.outputs.rolled_back != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Merge release branch into main and push tag
        if: steps.observe.outputs.rolled_back != 'true'
        shell: bash
        env:
          RELEASE_BRANCH: ${{ needs.meta.outputs.release_branch }}
          TAG_NAME: ${{ needs.meta.outputs.tag_name }}
        run: |
          set -euo pipefail

          git fetch origin main "${RELEASE_BRANCH}" --tags

          current_release_sha="$(git rev-parse "origin/${RELEASE_BRANCH}")"
          if [ "${current_release_sha}" != "${GITHUB_SHA}" ]; then
            echo "::warning::Branch ${RELEASE_BRANCH} moved from ${GITHUB_SHA} to ${current_release_sha}. Skipping promotion of stale commit."
            exit 0
          fi

          if git rev-parse "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists. Aborting promotion." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B main origin/main
          git merge --no-ff "${GITHUB_SHA}" -m "chore(release): merge ${RELEASE_BRANCH} into main (${TAG_NAME})"
          git push origin main

          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "refs/tags/${TAG_NAME}"

          {
            echo "### Release Promoted to \`main\`"
            echo ""
            echo "- **Merged Branch**: \`${RELEASE_BRANCH}\` (\`${GITHUB_SHA}\`)"
            echo "- **Target Branch**: \`main\`"
            echo "- **Created Tag**: \`${TAG_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
